context:
  version: "2.19.1"

recipe:
  name: pagmo-split
  version: ${{ version }}

source:
  url: https://github.com/esa/pagmo2/archive/v${{ version }}.tar.gz
  sha256: ecc180e669fa6bbece959429ac7d92439e89e1fd1c523aa72b11b6c82e414a1d

build:
  number: 14

outputs:
  - package:
      name: pagmo
    requirements:
      build:
        - ${{ compiler('cxx') }}
        - ${{ compiler('c') }}
        - ${{ stdlib("c") }}
        - cmake
        - ninja
      host:
        - eigen >=3.4.0,<5
        - nlopt
        - libboost-devel
        - tbb-devel
        - ipopt
    build:
      script:
        - if: unix
          then: build.sh
          else: build.bat
      files:
        - if: unix
          then:
            - lib/libpagmo*${{ SHLIB_EXT }}
          else:
            - Library/bin/pagmo.dll
    tests:
      - script:
          - if: unix
            then:
              - test -f $PREFIX/lib/libpagmo${SHLIB_EXT}
            else:
              - if not exist %PREFIX%\\Library\\bin\\pagmo.dll exit 1

  - package:
      name: pagmo-devel
    requirements:
      build:
        - ${{ compiler('cxx') }}
        - ${{ compiler('c') }}
        - ${{ stdlib("c") }}
        - cmake
        - ninja
      host:
        - eigen >=3.4.0,<5
        - nlopt
        - tbb-devel
        - ipopt
      run:
        - ${{ pin_subpackage("pagmo", exact=True) }}
        - eigen >=3.4.0,<5
        - tbb-devel
        - libboost-devel
      run_exports:
        # NOTE: don't need to list tbb, as
        # the pagmo public headers do not
        # use tbb (thus, a dependee of pagmo
        # does not need to link to tbb).
        # pagmo's API and ABI change at minor rev bumps.
        - ${{ pin_subpackage('pagmo', upper_bound='x.x') }}
        - ${{ pin_compatible('libboost', upper_bound='x.x') }}
        - ${{ pin_compatible('nlopt', upper_bound='x.x') }}
        # NOTE: ipopt might change the ABI at minor version bumps:
        # https://github.com/conda-forge/ipopt-feedstock/issues/85#issuecomment-1168571776
        - ${{ pin_compatible('ipopt', upper_bound='x.x.x') }}
    build:
      script:
        - if: unix
          then: build.sh
          else: build.bat
      files:
        - if: unix
          then:
            - include/pagmo
            - lib/cmake/pagmo
          else:
            - Library/include/pagmo
            - Library/lib/pagmo.lib
            - Library/lib/cmake/pagmo
    tests:
      - script:
          - if: unix
            then:
              - test -f $PREFIX/include/pagmo/config.hpp
            else:
              - if not exist %PREFIX%\\Library\\include\\pagmo\\config.hpp exit 1
              - if not exist %PREFIX%\\Library\\lib\\pagmo.lib exit 1

about:
  homepage: https://esa.github.io/pagmo2/
  license: GPL-3.0-or-later OR LGPL-3.0-or-later
  license_file: COPYING.lgpl3
  summary: A C++ platform to perform parallel computations of optimisation tasks (global and local) via the asynchronous generalized island model

extra:
  recipe-maintainers:
    - bluescarni
    - darioizzo
    - jschueller
